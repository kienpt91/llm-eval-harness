[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Treat LLM behaviour like tested software: golden datasets, graders, cost and latency accounting, baseline comparison and a CI gate that treats safety cases as fatal."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kien Phan" }]
keywords = ["llm", "evaluation", "evals", "ci", "safety", "prompt-injection", "regression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# The package has no runtime dependencies: standard library only. Development tools are pinned in requirements-dev.txt.
dependencies = []

[project.scripts]
llm-eval = "llm_eval_harness.composition.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval_harness = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: starts real child processes or servers",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["llm_eval_harness"]
branch = true
data_file = "out/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "\\.\\.\\.$",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
explicit_package_bases = true
mypy_path = "src:tests"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "PL", "TRY", "PERF", "A", "ARG", "RET"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "SIM102", "SIM108", "PERF401", "PERF203", "RET504", "E501",  # size/complexity limits are a review matter here
  "TRY003", "TRY300", "TRY301",
  "S101",                                                  # assert is how the tests are written
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLC0415", "RUF012", "PT011", "PT012"]
"scripts/**" = ["S603", "S607", "S310", "PLC0415"]
"examples/**" = ["S", "PLC0415"]
